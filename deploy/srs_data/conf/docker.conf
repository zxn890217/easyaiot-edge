# SRS Docker 配置文件
# 用于 Docker 容器部署的 SRS 配置
#
# 录像与日志目录（容器内路径，勿改为宿主机路径）：
# - 以下 srs_log_file、dvr_path 均使用容器内 /data/...（与 compose 中 volume 目标路径一致）
# - 宿主机 NFS 媒体根挂载为容器 /data（见 docker-compose：${EASYAIOT_MEDIA_ROOT}:/data），容器内例如 /data/playbacks/...

listen              1935;
max_connections     1000;
daemon              on;
srs_log_tank        file;
srs_log_file        /data/srs.log;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
    raw_api {
        enabled             on;
        allow_reload        on;
    }
}
stats {
    network         0;
}
rtc_server {
    enabled on;
    listen 8000;
    candidate *;
}

vhost __defaultVhost__ {
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled     on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
    }
    dvr {
        enabled             on;
        dvr_path            /data/playbacks/[app]/[stream]/[2006]/[01]/[02]/[timestamp].flv;
        dvr_plan            segment;
        dvr_duration        30;
        dvr_wait_keyframe   on;
    }
    http_hooks {
        enabled             on;
        on_dvr              http://127.0.0.1:6000/video/media/hook/srs/on_dvr;
        on_publish          http://127.0.0.1:6000/video/camera/callback/on_publish;
    }
    # 回调地址说明（edge/standalone 形态，SRS 与 VIDEO 同机 host 网络）：
    # - on_dvr：直连 VIDEO 6000 的 /video/media/hook/srs/on_dvr（录像事件）
    # - on_publish：直连 VIDEO 6000 的 /video/camera/callback/on_publish（推流鉴权）
    # full/standard 形态需改成经 Gateway -> iot-sink（见 deploy_profile.sh _apply_python_sink_media_env）
}

